# MLflow tracking server + model API + read-only dashboard (http://localhost:8080).
# Train against the server from the host:
#   MLFLOW_TRACKING_URI=http://localhost:5000 uv run python scripts/train_classifier.py --promote
# then `docker compose restart api` to load the new production model.
# Dashboard shows data/reports/dashboard.json: refresh it with scripts/export_dashboard_data.py
# (the file is read on every request, no restart needed).
services:
  mlflow:
    build: .
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts --serve-artifacts
    ports: ["5000:5000"]
    volumes: ["mlflow-data:/mlflow"]

  api:
    build: .
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      STANCE_MODEL_URI: models:/stance-classifier@production
    ports: ["8000:8000"]
    depends_on: [mlflow]

  dashboard:
    build: ./dashboard
    environment:
      DASHBOARD_DATA: /data/dashboard.json
    ports: ["8080:8000"]
    volumes: ["./data/reports:/data:ro"]
    # Live reload: `docker compose watch dashboard` syncs code changes into the container.
    develop:
      watch:
        - {action: sync, path: ./dashboard/resources, target: /app/resources}
        - {action: sync, path: ./dashboard/app, target: /app/app}
        - {action: sync, path: ./dashboard/routes, target: /app/routes}
        - {action: rebuild, path: ./dashboard/composer.lock}

volumes:
  mlflow-data:
